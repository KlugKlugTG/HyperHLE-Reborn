import org.gradle.nativeplatform.platform.internal.DefaultNativePlatform

apply plugin: 'com.android.application'
apply plugin: "com.github.willir.rust.cargo-ndk-android"
apply plugin: 'org.jetbrains.kotlin.android'

static def runTouchHLEVersionTool(boolean wantBranding) {
    return ('cargo run --package touchHLE_version' + (wantBranding ? ' -- --branding' : '')).execute().text.trim()
}

static def getTouchHLEBranding() {
    return runTouchHLEVersionTool(/* wantBranding: */ true)
}

static def getTouchHLEVersionName() {
    return runTouchHLEVersionTool(/* wantBranding: */ false)
}

static def join(String prefix, String separator, String branding) {
    if (branding.isEmpty()) {
        return prefix
    } else {
        return prefix + separator + branding
    }
}


def getTouchHLEVersionCode() {
    def base = getTouchHLEVersionName().trim().replaceFirst('^v', '').split(' ')[0]
    def parts = base.tokenize('.')
    int code = 0
    for (int i = 0; i < 3; i++) {
        def part = i < parts.size() ? parts[i].replaceAll('[^0-9].*', '') : '0'
        code = code * 100 + (part.isEmpty() ? 0 : part as int)
    }
    def runNumber = System.getenv('GITHUB_RUN_NUMBER')
    return runNumber == null ? code : Math.max(code, 1000) + (runNumber as int)
}



def hyperHLEKeystoreFile = System.getenv('HYPERHLE_KEYSTORE_FILE')
def hyperHLEKeystoreB64 = System.getenv('HYPERHLE_KEYSTORE_B64')
def hyperHLEUsesExternalKey = (hyperHLEKeystoreB64 != null && !hyperHLEKeystoreB64.trim().isEmpty()) || (hyperHLEKeystoreFile != null && !hyperHLEKeystoreFile.trim().isEmpty())
def hyperHLEKeystorePass = System.getenv('HYPERHLE_KEYSTORE_PASSWORD') ?: 'hyperhle'
def hyperHLEKeyAlias = System.getenv('HYPERHLE_KEY_ALIAS') ?: 'hyperhle'
def hyperHLECommittedKeystore = file("${rootDir}/keystore/release.keystore")
def hyperHLEHasReleaseKey = hyperHLEUsesExternalKey || hyperHLECommittedKeystore.exists()


android {
    ndkVersion "25.2.9519653"
    compileSdkVersion 35
    signingConfigs {
        release {
            if (hyperHLEKeystoreB64 != null && !hyperHLEKeystoreB64.trim().isEmpty()) {
                def tmp = File.createTempFile('hyperhle', '.keystore')
                tmp.deleteOnExit()
                tmp.bytes = hyperHLEKeystoreB64.decodeBase64()
                storeFile tmp
            } else if (hyperHLEKeystoreFile != null && !hyperHLEKeystoreFile.trim().isEmpty()) {
                storeFile file(hyperHLEKeystoreFile)
            } else if (hyperHLECommittedKeystore.exists()) {
                storeFile hyperHLECommittedKeystore
            }
            if (hyperHLEHasReleaseKey) {
                storePassword hyperHLEKeystorePass
                keyAlias hyperHLEKeyAlias
                keyPassword hyperHLEKeystorePass
            }
        }
        debug {
            if (file('../debug.keystore').exists()) {
                storeFile file('../debug.keystore')
            }
        }
    }
    defaultConfig {
        def branding = getTouchHLEBranding()
        applicationId 'org.hyperhle.reborn'
        applicationIdSuffix(branding.isEmpty() ? null : '.' + branding.toLowerCase())
        resValue 'string', 'app_name', join('HyperHLE-Reborn-Fork-V2', ' ', branding)
        buildConfigField 'String', 'APP_NAME', ('"' + join('HyperHLE-Reborn-Fork-V2', ' ', branding) + '"')
        manifestPlaceholders = [
                icon: (branding.toLowerCase() == 'unofficial' ? '@drawable/icon' : join('@drawable/icon', '_', branding.toLowerCase()))
        ]
        buildConfigField 'int', 'APP_ICON', (branding.toLowerCase() == 'unofficial' ? 'R.drawable.icon' : join('R.drawable.icon', '_', branding.toLowerCase()))

        versionCode getTouchHLEVersionCode()
        versionName join(getTouchHLEVersionName(), ' ', branding)

        minSdkVersion 21 // first version with AArch64
        targetSdkVersion 35
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                // abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
                // Only 'arm64-v8a' and 'x86_64' are supported by dynarmic
                // and hence touchHLE. The 'x86_64' build works, but the main
                // use for that would be the emulator in Android Studio, and
                // its OpenGL ES implementations don't seem to work properly
                // with touchHLE, so we disable it to reduce build time and
                // avoid shipping stuff we haven't meaningfully tested.
                // Make sure this matches the cargoNdk targets below.
                abiFilters 'arm64-v8a'
            }
        }
    }
    // The target JVM version must be the same for Java and Kotlin.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = "11"
    }
    buildTypes {
        release {
            if (hyperHLEHasReleaseKey) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            debuggable true // allow use of ADB to manage files, etc
        }
        debug {
            minifyEnabled false
            packagingOptions {
                doNotStrip '**/*.so'
            }
            debuggable true
            jniDebuggable true
        }
    }
    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
                .dependsOn("externalNativeBuild${variant.name.capitalize()}")
        variant.outputs.all { output ->
            outputFileName = "HyperHLE-Reborn-${variant.name}.apk"
        }
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir "${projectDir}/jniLibs"
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }
    }

    lintOptions {
        abortOnError false
    }
    namespace 'org.touchhle.android'
}

cargoNdk {
    // Make sure this matches the android abiFilters above.
    targets = ["arm64"]
    module = ".."
    librariesNames = ["libtouchHLE.so", "libSDL2.so", "libc++_shared.so"]
    extraCargoEnv = ["ANDROID_NDK": android.ndkDirectory, "ANDROID_NDK_HOME": android.ndkDirectory]
    if (DefaultNativePlatform.host().operatingSystem.isWindows()) {
        def binPath = android.ndkDirectory.toPath().resolve("toolchains/llvm/prebuilt/windows-x86_64/bin")
        def clangPath = binPath.resolve("clang.exe")
        def clangXXPath = binPath.resolve("clang++.exe")

        if (!clangPath.toFile().exists()) {
            throw new GradleException("NDK clang compiler not found at expected location: $clangPath")
        }
        if (!clangXXPath.toFile().exists()) {
            throw new GradleException("NDK clang++ compiler not found at expected location: $clangXXPath")
        }

        extraCargoEnv.putAll([
                "CC"             : clangPath.toString(),
                "CXX"            : clangXXPath.toString(),
                // The default generator on Windows (Visual Studio) does not respect
                // the CC and CXX environment variables. Using Ninja ensures that
                // the specified compilers are used
                "CMAKE_GENERATOR": "Ninja"
        ])
    }
    // The default feature, "static", makes us use static linking for SDL2 and OpenAL Soft.
    // For Android, we need dynamic linking for SDL2, but static linking for OpenAL Soft.
    // libxml2 is also statically linked from the vendored source because Android has no system libxml2.
    extraCargoBuildArguments = ["--lib", "--no-default-features", "--features", "touchHLE_openal_soft_wrapper/static,touchHLE_libxml2_wrapper/static,sdl2/bundled"]
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
