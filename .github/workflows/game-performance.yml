name: Game performance capture

on:
  workflow_dispatch:
    inputs:
      cases:
        description: "JSON array of cases with label, run, artifact and runner, optionally before_run + before_artifact for A/B/B/A or renderer=angle-metal on macOS"
        required: true
        type: string
      draft:
        description: Draft release with game.ipa
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of game.ipa
        required: true
        type: string
      steps:
        description: Space-separated WAIT:X,Y steps for ai-tap-sequence.py
        type: string

jobs:
  measure:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      actions: read
      contents: write # Reading an unpublished draft release requires write access.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.cases) }}
    env:
      BUILD_RUN: ${{ matrix.run }}
      BEFORE_RUN: ${{ matrix.before_run }}
      BEFORE_ARTIFACT: ${{ matrix.before_artifact }}
      DRAFT: ${{ inputs.draft }}
      FIXTURE_HASH: ${{ inputs.sha256 }}
      STEPS: ${{ inputs.steps || '1:- 20:-' }}
      TRACE: ${{ matrix.trace }}
      DEBUGGER: ${{ matrix.debugger }}
      IMAGE_LOOKUP: ${{ matrix.dladdr }}
      PRESERVE_STUBS: ${{ matrix.preserve }}
      RENDERER: ${{ matrix.renderer }}
      EMULATOR_GL_OPTION: ''
      ALSOFT_DRIVERS: 'null'
      TOUCHHLE_FRAME_TIMES: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Identify build and verify private fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p results "$RUNNER_TEMP/fixture"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" --jq '{id,head_sha,html_url}' > results/build.json
          if [[ -n "$BEFORE_RUN" || -n "$BEFORE_ARTIFACT" ]]; then
            test -n "$BEFORE_RUN" && test -n "$BEFORE_ARTIFACT"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BEFORE_RUN" --jq '{id,head_sha,html_url}' > results/before-build.json
          fi
          test "$(gh release view "$DRAFT" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release download "$DRAFT" --repo "$GITHUB_REPOSITORY" --pattern game.ipa --dir "$RUNNER_TEMP/fixture"
          cd "$RUNNER_TEMP/fixture"
          actual=$(shasum -a 256 game.ipa)
          test "${actual%% *}" = "$FIXTURE_HASH"
          echo "$actual" > "$GITHUB_WORKSPACE/results/source.sha256"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ env.BUILD_RUN }}
          name: ${{ matrix.artifact }}
          path: emulator
      - uses: actions/download-artifact@v4
        if: matrix.before_run
        with:
          github-token: ${{ github.token }}
          run-id: ${{ matrix.before_run }}
          name: ${{ matrix.before_artifact }}
          path: baseline
      - name: Install Linux runtime tools and identify renderer
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xdotool x11-utils imagemagick mesa-utils libsndio-dev sysstat gdb gdb-multiarch
          if ! xdpyinfo >/dev/null 2>&1; then
            export DISPLAY=:99
            Xvfb "$DISPLAY" -screen 0 1280x960x24 -ac > results/xvfb.log 2>&1 &
            for _ in {1..30}; do xdpyinfo >/dev/null 2>&1 && break; sleep 0.2; done
          fi
          echo "DISPLAY=$DISPLAY" >> "$GITHUB_ENV"
          glxinfo -B | tee results/glxinfo.txt
          ls -l /dev/dri > results/gpu-devices.txt 2>&1 || true
          lscpu > results/cpu.txt
          chmod +x emulator/touchHLE
          if [[ -d baseline ]]; then chmod +x baseline/touchHLE; fi
      - name: Prepare Apple Silicon emulator and record Metal hardware
        if: runner.os == 'macOS'
        run: |
          mountpoint="$RUNNER_TEMP/emulator-disk"
          for bundle in emulator baseline; do
            if [[ ! -d "$bundle" ]]; then continue; fi
            hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "$bundle"/*.dmg
            # Unbundled binaries use the per-launch working directory for user data.
            cp "$mountpoint"/*.app/Contents/MacOS/touchHLE "$bundle/"
            cp -R "$mountpoint"/*.app/Contents/Resources/touchHLE_* "$bundle/"
            hdiutil detach "$mountpoint"
          done
          system_profiler SPDisplaysDataType SPHardwareDataType |
            sed -E '/Serial Number|Hardware UUID|Provisioning UDID/d' > results/hardware.txt
          swift -e 'import Metal; print("Default Metal device:", MTLCreateSystemDefaultDevice()?.name ?? "none"); for device in MTLCopyAllDevices() { print("Metal device:", device.name) }' | tee results/metal.txt
          if [[ "$RENDERER" == angle-metal ]]; then
            # Electron ships a matching ARM64 EGL/GLES pair in its Mac framework.
            curl -fsSL --retry 3 https://github.com/electron/electron/releases/download/v33.4.11/electron-v33.4.11-darwin-arm64.zip -o "$RUNNER_TEMP/egl.zip"
            unzip -j "$RUNNER_TEMP/egl.zip" '*/Versions/A/Libraries/libEGL.dylib' '*/Versions/A/Libraries/libGLESv2.dylib' -d "$RUNNER_TEMP/angle"
            libraries="$RUNNER_TEMP/angle"
            test -s "$libraries/libEGL.dylib"
            test -s "$libraries/libGLESv2.dylib"
            echo "SDL_VIDEO_EGL_DRIVER=$libraries/libEGL.dylib" >> "$GITHUB_ENV"
            echo "SDL_VIDEO_GL_DRIVER=$libraries/libGLESv2.dylib" >> "$GITHUB_ENV"
            echo "ANGLE_DEFAULT_PLATFORM=metal" >> "$GITHUB_ENV"
            echo "TOUCHHLE_FORCE_GLES1=gles1_on_gles2" >> "$GITHUB_ENV"
            echo "EMULATOR_GL_OPTION=--gles1=gles1_native" >> "$GITHUB_ENV"
          fi
          python3 -m venv "$RUNNER_TEMP/game-python"
          "$RUNNER_TEMP/game-python/bin/pip" install --disable-pip-version-check pillow pyobjc-framework-Quartz
          echo "$RUNNER_TEMP/game-python/bin" >> "$GITHUB_PATH"
      - name: Capture game, memory use and renderer
        shell: bash
        run: |
          export RUST_BACKTRACE=1
          mkdir -p results/play
          export TOUCHHLE_TRACE_TOUCHES=1
          if [[ "$TRACE" == 1 ]]; then export SURFACE_RUNTIME_TRACE=1; fi
          emulator="$GITHUB_WORKSPACE/emulator/touchHLE"
          if [[ "$RUNNER_OS" == Linux ]]; then
            group=/sys/fs/cgroup/hle-test
            sudo mkdir "$group"
            echo 1800M | sudo tee "$group/memory.max" >/dev/null
            echo 0 | sudo tee "$group/memory.swap.max" >/dev/null
            export HLE_CGROUP="$group"
            printf '%s\n' '#!/bin/bash' 'echo "$$" | sudo tee "$HLE_CGROUP/cgroup.procs" >/dev/null' 'exec "$HLE_BINARY" "$@"' > "$RUNNER_TEMP/run-game"
            export HLE_BINARY="$emulator"
            chmod +x "$RUNNER_TEMP/run-game"
            emulator="$RUNNER_TEMP/run-game"
            (
              while true; do
                pid=$(pgrep -nx touchHLE || true)
                if [[ -n "$pid" ]]; then
                  awk '/VmRSS|VmSize/ {printf "%s %s ",$1,$2} END {print ""}' "/proc/$pid/status" || true
                  rss=$(awk '/VmRSS/ {print $2}' "/proc/$pid/status" || true)
                  if [[ ${rss:-0} -gt 700000 && ! -e results/native-stack.txt ]]; then
                    sudo gdb -nx -batch -p "$pid" -ex 'set pagination off' -ex 'thread apply all bt 14' > results/native-stack.txt 2>&1 || true
                  fi
                fi
                sleep .15
              done
            ) > results/memory-samples.txt 2>&1 &
            watcher=$!
            trap 'kill "$watcher" || true; cat "$HLE_CGROUP/memory.events" > results/memory-events.txt; cp emulator/HyperHLE_log.txt results/runtime.log || true' EXIT
          else
            trap 'cp emulator/HyperHLE_log.txt results/runtime.log || true' EXIT
            if [[ "$RENDERER" == angle-metal ]]; then
              otool -L "$SDL_VIDEO_GL_DRIVER" > results/angle-libs.txt
              export DYLD_LIBRARY_PATH="$(dirname "$SDL_VIDEO_GL_DRIVER"):${DYLD_LIBRARY_PATH:-}"
              python3 -c 'import os,ctypes; [print(ctypes.CDLL(os.environ[k])) for k in ("SDL_VIDEO_EGL_DRIVER","SDL_VIDEO_GL_DRIVER")]' >> results/angle-libs.txt 2>&1 || true
            fi
          fi
          if [[ "$DEBUGGER" == guest ]]; then
            (
              for i in {1..120}; do
                if ss -lt | grep -q ':23450 '; then break; fi
                sleep .2
              done
              gdb-multiarch -nx -q -batch -x "$GITHUB_WORKSPACE/dev-scripts/pes-guest.gdb"
            ) > results/guest-debugger.txt 2>&1 &
          fi
          read -r -a steps <<< "$STEPS"
          args=()
          for step in "${steps[@]}"; do args+=(--step "$step"); done
          gl=()
          if [[ -n "$EMULATOR_GL_OPTION" ]]; then gl+=("$EMULATOR_GL_OPTION"); fi
          if [[ "$IMAGE_LOOKUP" == 1 ]]; then gl+=(--dladdr); fi
          if [[ "$PRESERVE_STUBS" == 1 ]]; then gl+=(--preserve-dyld-stubs); fi
          if [[ "$DEBUGGER" == guest ]]; then gl+=(--gdb=127.0.0.1:23450); fi
          if [[ "$DEBUGGER" == watch ]]; then
            export HLE_WATCH_SCRIPT="$GITHUB_WORKSPACE/dev-scripts/pes-host.gdb"
            printf '%s\n' '#!/bin/bash' 'echo "$$" | sudo tee "$HLE_CGROUP/cgroup.procs" >/dev/null' 'exec gdb -nx -q -batch -x "$HLE_WATCH_SCRIPT" --args "$HLE_BINARY" "$@"' > "$RUNNER_TEMP/run-game"
          fi
          python3 dev-scripts/ai-tap-sequence.py "$RUNNER_TEMP/fixture/game.ipa" --exe "$emulator" --cwd emulator --out results/play "${args[@]}" --final-wait 5 --require-frame-change --require-nonblack-frame --require-frame-content -- "${gl[@]}" --device-family=iphone-4s --overlay=off --no-error-popup
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-performance-${{ matrix.label }}
          path: results/
