name: Performance comparison builds
on:
  workflow_dispatch:
    inputs:
      stages:
        description: JSON array of stage names and full revisions
        type: string
        required: true
  push:
    branches: [fix/profile-game-performance]
    paths: [.github/workflows/profile-stage-builds.yml]
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.stages || '[{"stage":"semaphore","revision":"79712f8fbbbe4d25cb0e0bd32ee5ca17bb16191e"},{"stage":"discard","revision":"f515fb097b3dda1e5645405f63be680f045da429"}]') }}
    runs-on: ubuntu-latest
    env:
      # GCC 15 defaults to C23; bundled SDL2 uses bool/true/false as identifiers.
      # https://gcc.gnu.org/gcc-15/porting_to.html#c23
      CFLAGS: -std=gnu17

    steps:
      - name: Checkout touchHLE
        uses: actions/checkout@main
        with:
          ref: ${{ matrix.revision }}
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Install Linux build dependencies
        # SDL2 and openal-soft are built from source (the `static` feature uses
        # the `bundled` SDL2 build), so the development headers for the audio,
        # video and input backends they detect must be available.
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential \
            pkg-config \
            libasound2-dev \
            libpulse-dev \
            libsndio-dev \
            libdbus-1-dev \
            libudev-dev \
            libx11-dev \
            libxext-dev \
            libxcursor-dev \
            libxi-dev \
            libxrandr-dev \
            libxss-dev \
            libxxf86vm-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@master

      - name: Try to get cached copy of Boost
        id: cache-boost
        uses: actions/cache@main
        with:
          path: vendor/boost
          key: boost_1_81_0_linux

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Download Boost
        run: curl -L -O "https://archives.boost.io/release/1.81.0/source/boost_1_81_0.tar.gz"

      - if: ${{ steps.cache-boost.outputs.cache-hit != 'true' }}
        name: Extract Boost
        run: mkdir -p vendor && tar xzf boost_1_81_0.tar.gz -C vendor && mv vendor/boost_1_81_0 vendor/boost

      - name: Setup CMake
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "~3.29.0"

      - name: Build
        run: cargo build --release --locked

      - name: Create bundle
        run: cd dev-scripts && ./make-linux-bundle.sh ../target/release/touchHLE && mv touchHLE_linux_bundle/ ..

      - uses: actions/upload-artifact@main
        with:
          name: Linux-${{ matrix.stage }}
          path: touchHLE_linux_bundle/

