name: Native GLES 1.1 ANGLE diagnostics

on:
  push:
    branches: ["fix/gameloft-video-menu", "fix/native-angle-validation"]
    paths:
      - .github/workflows/native-angle-diagnostic.yml
      - dev-scripts/build-native-angle-ci.sh
  workflow_dispatch:

concurrency:
  group: native-angle-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  angle-linux-arm64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gcc-14 g++-14 pkg-config python3 python3-setuptools curl git ca-certificates libglib2.0-dev libnss3-dev libpci-dev libdrm-dev libgbm-dev libgl-dev libxkbcommon-dev libxshmfence-dev libx11-dev libxext-dev libxi-dev libxrandr-dev libxcb1-dev libwayland-dev libvulkan-dev ninja-build unzip
      - name: Build the Android ANGLE revision for native Linux GLES tests
        run: dev-scripts/build-native-angle-ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Native_ANGLE_build_log
          path: native-angle-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: ANGLE_Linux_ARM64_GLES1
          path: native-angle-bundle/
